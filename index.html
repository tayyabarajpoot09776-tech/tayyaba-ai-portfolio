
<!-- MediBot AI Chatbot -->
<style>
#medi-chat-btn {
  position:fixed; bottom:22px; right:22px; z-index:9999;
  background:linear-gradient(135deg,#176b87,#21b6a8);
  color:white; border:0; border-radius:30px;
  padding:15px 22px; font-weight:bold; cursor:pointer;
  box-shadow:0 5px 20px #0003;
}
#medi-chat {
  display:none; position:fixed; z-index:9999;
  bottom:85px; right:20px; width:min(350px,90vw);
  height:450px; background:white; border-radius:18px;
  box-shadow:0 5px 30px #0003; overflow:hidden;
  font-family:Arial,sans-serif;
}
#medi-chat.open {display:flex; flex-direction:column;}
#medi-head {background:#123b55;color:white;padding:17px;font-weight:bold;}
#medi-head small {display:block;font-weight:normal;margin-top:5px;}
#medi-msg {flex:1;overflow-y:auto;padding:12px;background:#f3f8fa;}
.medi-bubble {padding:11px;margin:8px 0;border-radius:12px;
  font-size:13px;line-height:1.5;white-space:pre-wrap;}
.medi-bot {background:white;color:#123b55;}
.medi-user {background:#176b87;color:white;margin-left:35px;}
#medi-form {display:flex;padding:10px;gap:6px;}
#medi-input {flex:1;min-width:0;padding:11px;border:1px solid #ccc;border-radius:10px;}
#medi-send {background:#176b87;color:white;border:0;padding:10px;border-radius:10px;}
#medi-disclaimer {font-size:10px;text-align:center;color:#64748b;padding:7px;}
</style>

<button id="medi-chat-btn" onclick="mediToggle()">✚ Chat with MediBot AI</button>

<div id="medi-chat">
  <div id="medi-head">
    ✚ MediBot AI
    <small>Healthcare Information Assistant</small>
    <button onclick="mediToggle()" style="float:right;background:none;color:white;border:0;font-size:20px;">×</button>
  </div>
  <div id="medi-msg">
    <div class="medi-bubble medi-bot">
      Hello! Welcome to MediBot AI.

      I can help you understand general health information, symptoms, medicine information and AI in healthcare.

      How can I help you today?
    </div>
  </div>
  <form id="medi-form">
    <input id="medi-input" placeholder="Ask your question..." required>
    <button id="medi-send" type="submit">Send</button>
  </form>
  <div id="medi-disclaimer">
    Educational information only. Not a substitute for professional medical advice.
  </div>
</div>

<script>
function mediToggle() {
  document.getElementById("medi-chat").classList.toggle("open");
}

function mediReply(q) {
  q = q.toLowerCase();

  if (/chest pain|can't breathe|cannot breathe|severe bleeding|unconscious|stroke/.test(q)) {
    return "This may be a medical emergency. Contact local emergency services or visit the nearest emergency department immediately.";
  }
  if (/hello|hi|hey/.test(q)) {
    return "Hello! Welcome to MediBot AI. What healthcare topic would you like to explore?";
  }
  if (/medicine|tablet|paracetamol|drug|side effect/.test(q)) {
    return "Medicines have different uses, strengths and possible side effects. Check the official patient leaflet and consult a pharmacist or doctor before taking or changing any medicine. Tell me the medicine name if you want general information.";
  }
  if (/symptom|fever|headache|cough|pain/.test(q)) {
    return "Symptoms can have many causes. Their duration, severity and other symptoms matter. I can provide general educational information, but a qualified doctor must assess your condition.";
  }
  if (/artificial intelligence|healthcare|machine learning|AI/.test(q)) {
    return "Artificial Intelligence in healthcare can support medical image analysis, patient-data research, early risk identification and hospital workflows. AI supports healthcare professionals; it does not replace clinical judgement.";
  }
  if (/hospital|doctor|clinic/.test(q)) {
    return "Choose a healthcare facility based on your medical needs, location and available specialists. For urgent symptoms, visit the nearest emergency department.";
  }
  return "Thank you for your question! I am a healthcare information demonstration chatbot. I can explain general symptoms, medicines and AI in healthcare. For personal medical advice, please consult a qualified healthcare professional.";
}

document.getElementById("medi-form").addEventListener("submit", function(e) {
  e.preventDefault();
  const input = document.getElementById("medi-input");
  const question = input.value.trim();
  if (!question) return;

  const area = document.getElementById("medi-msg");

  const user = document.createElement("div");
  user.className = "medi-bubble medi-user";
  user.textContent = question;
  area.appendChild(user);

  const bot = document.createElement("div");
  bot.className = "medi-bubble medi-bot";
  bot.textContent = mediReply(question);
  area.appendChild(bot);

  input.value = "";
  area.scrollTop = area.scrollHeight;
});
</script>
